<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader</title>
  <style>
    html:not(.ready) { background: #1b1b1f; }
    html:not(.ready) body > * { visibility: hidden; }
    html:not(.ready) body::after {
      content: ''; position: fixed; top: 50%; left: 50%; width: 32px; height: 32px; margin: -19px;
      border: 3px solid #3a3a44; border-top-color: #e8e8ea; border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="stage">
    <div id="viewport">
      <div id="sizer">
        <div id="book"></div>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div id="toolbar">
    <button id="prev" class="btn icon-only" type="button" data-title="prevTitle"><span data-icon="prev"></span></button>
    <span id="pageLabel">– / –</span>
    <button id="next" class="btn icon-only" type="button" data-title="nextTitle"><span data-icon="next"></span></button>
    <span class="sep"></span>
    <button id="zoomOut" class="btn icon-only" type="button" data-title="zoomOut"><span data-icon="zoomOut"></span></button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" class="btn icon-only" type="button" data-title="zoomIn"><span data-icon="zoomIn"></span></button>
    <button id="zoomFit" class="btn" type="button" data-title="zoomFitTitle"><span data-icon="fit"></span><span class="lbl" data-text="zoomFit"></span><span class="lbl-short" data-text="zoomFitShort"></span></button>
    <span class="sep"></span>
    <button id="download" class="btn" type="button" data-title="downloadTitle"><span data-icon="download"></span><span class="lbl" data-text="download"></span></button>
    <button id="fs" class="btn" type="button" data-title="fullscreenTitle"><span data-icon="fs"></span><span class="lbl" data-text="fullscreen"></span></button>
    <button id="lang" class="btn" type="button" data-title="langToggleTitle" data-text="langToggle"></button>
  </div>

  <div id="error"></div>
</body>
</html>
